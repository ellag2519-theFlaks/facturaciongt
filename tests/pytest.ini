[pytest]
; Base directory for Playwright's own artifacts (traces, automatic
; screenshots, and --video recordings). Keeps generated videos under
; tests/videos/ instead of the pytest-playwright default (test-results/).
;
; tests/evidence/ (manual save_evidence() screenshots) and tests/reports/
; (results.json + pytest-html report) are created on demand by conftest.py
; itself, so they don't need to be registered here.
;
; Pass --video=on explicitly on the CLI to enable video recording, e.g.:
;   py -m pytest test_auth.py --video=on --html=reports/report.html -v
addopts = --output=videos
testpaths = .
